<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPTChatDownloader Settings</title>
    <style>
      :root {
        --canvas: #ffffff;
        --surface: #f6f8fa;
        --border: #d0d7de;
        --text: #1b1f24;
        --text-muted: #636c76;
        --accent: #10a37f;
        --accent-hover: #0d8e6d;
        --github: #24292e;
        --github-hover: #1b1f23;
        --danger: #cf222e;
        --danger-surface: #fff1f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 520px;
        margin: 48px auto;
        padding: 0 20px;
        color: var(--text);
        line-height: 1.5;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin-bottom: 4px;
      }

      p.subtitle {
        color: var(--text-muted);
        font-size: 13px;
        margin-top: 0;
        margin-bottom: 32px;
      }

      fieldset {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px 18px;
        margin: 0 0 16px 0;
      }

      legend {
        font-weight: 600;
        font-size: 13px;
        padding: 0 6px;
        color: var(--text);
      }

      label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13.5px;
        padding: 7px 0;
        cursor: pointer;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        background: var(--surface);
        padding: 1px 5px;
        border-radius: 4px;
      }

      select {
        font-size: 13px;
        padding: 4px 6px;
        border-radius: 4px;
        border: 1px solid var(--border);
      }

      button {
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        border-radius: 6px;
        padding: 9px 18px;
        border: 1px solid transparent;
      }

      #save {
        background: var(--accent);
        color: #ffffff;
      }

      #save:hover {
        background: var(--accent-hover);
      }

      #status {
        font-size: 12px;
        color: var(--accent);
        margin-left: 10px;
        opacity: 0;
        transition: opacity 0.2s;
      }

      #status.visible {
        opacity: 1;
      }

      .row {
        display: flex;
        align-items: center;
      }

      /*
       * ---------------------------------------------------
       * GITHUB SECTION
       * ---------------------------------------------------
       */

      .github-status {
        font-size: 13.5px;
        color: var(--text-muted);
        margin: 0 0 12px 0;
      }

      .github-status.connected {
        color: var(--accent);
        font-weight: 500;
      }

      #github-connect {
        background: var(--github);
        color: #ffffff;
      }

      #github-connect:hover:not(:disabled) {
        background: var(--github-hover);
      }

      #github-connect:disabled {
        opacity: 0.6;
        cursor: default;
      }

      #github-disconnect {
        background: var(--canvas);
        color: var(--danger);
        border-color: var(--danger);
        margin-left: 8px;
      }

      #github-disconnect:hover {
        background: var(--danger-surface);
      }

      /*
       * ---------------------------------------------------
       * DEVICE CODE OVERLAY
       * ---------------------------------------------------
       *
       * Full-screen takeover for the one moment in this
       * whole extension that deserves visual weight: the
       * person is about to alt-tab away to authorize on
       * github.com, so they need exactly one thing to
       * remember, displayed as large and unmissable as
       * possible, with nothing else competing for attention.
       */

      #github-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(27, 31, 36, 0.6);
        backdrop-filter: blur(2px);
        align-items: center;
        justify-content: center;
        z-index: 100;
      }

      #github-overlay.open {
        display: flex;
      }

      #github-overlay-card {
        background: var(--canvas);
        border-radius: 16px;
        padding: 48px 56px;
        max-width: 420px;
        width: calc(100% - 48px);
        text-align: center;
        box-shadow: 0 24px 60px rgba(27, 31, 36, 0.35);
      }

      #github-overlay-eyebrow {
        font-size: 13px;
        color: var(--text-muted);
        margin: 0 0 20px 0;
      }

      #github-overlay-code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 40px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--text);
        margin: 0 0 24px 0;
        word-break: break-all;
      }

      #github-overlay-instruction {
        font-size: 14px;
        color: var(--text-muted);
        margin: 0 0 28px 0;
        line-height: 1.5;
      }

      #github-overlay-instruction strong {
        color: var(--text);
      }

      #github-overlay-spinner {
        width: 20px;
        height: 20px;
        margin: 0 auto 16px auto;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #github-overlay-cancel {
        background: none;
        color: var(--text-muted);
        border: none;
        font-size: 13px;
        text-decoration: underline;
        padding: 4px;
      }

      #github-overlay-error {
        display: none;
        font-size: 13px;
        color: var(--danger);
        margin: 0 0 20px 0;
      }
    </style>
  </head>
  <body>
    <h1>GPTChatDownloader Settings</h1>
    <p class="subtitle">These preferences apply to every export.</p>

    <fieldset>
      <legend>Message headings</legend>
      <label>
        <input type="radio" name="headingStyle" value="h2" />
        Markdown heading (<code>## User</code>)
      </label>
      <label>
        <input type="radio" name="headingStyle" value="bold" />
        Bold label (<code>**User:**</code>)
      </label>
      <label>
        <input type="radio" name="headingStyle" value="none" />
        No heading
      </label>
    </fieldset>

    <fieldset>
      <legend>Timestamp</legend>
      <label>
        <input type="checkbox" id="includeTimestamp" />
        Include export date/time at the top of the file
      </label>
    </fieldset>

    <fieldset>
      <legend>Spacing between messages</legend>
      <label>
        <input type="radio" name="messageSeparator" value="single" />
        Single blank line
      </label>
      <label>
        <input type="radio" name="messageSeparator" value="double" />
        Double blank line
      </label>
      <label>
        <input type="radio" name="messageSeparator" value="rule" />
        Horizontal rule (<code>---</code>)
      </label>
    </fieldset>

    <fieldset>
      <legend>GitHub</legend>
      <p id="github-status" class="github-status">
        Save exports straight to a GitHub repo.
      </p>
      <div class="row">
        <button id="github-connect">Connect GitHub</button>
        <button id="github-disconnect" hidden>Disconnect</button>
      </div>
    </fieldset>

    <div class="row">
      <button id="save">Save Settings</button>
      <span id="status">Saved</span>
    </div>

    <!--
      Device flow confirmation overlay. Hidden by default;
      options.ts opens it with the "open" class the moment
      GITHUB_START_AUTH returns a user_code, and closes it
      when GITHUB_AUTH_COMPLETE arrives (success or failure).
    -->
    <div id="github-overlay">
      <div id="github-overlay-card">
        <p id="github-overlay-eyebrow">Connect GitHub</p>
        <p id="github-overlay-code">····-····</p>
        <p id="github-overlay-instruction">
          A GitHub tab just opened. Enter this code there, then approve access
          for GPTChatDownloader.
        </p>
        <div
          id="github-overlay-spinner"
          role="status"
          aria-label="Waiting"
        ></div>
        <p id="github-overlay-error"></p>
        <button id="github-overlay-cancel">Cancel</button>
      </div>
    </div>

    <script type="module" src="/options.js"></script>
  </body>
</html>
